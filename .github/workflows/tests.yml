name: Source checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg nftables
      - run: uv venv .venv && uv pip install --python .venv/bin/python --require-hashes -r requirements.lock
      - run: PYTHONPATH=app .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check-release.py
      - run: bash -n ct/tapo-hub.sh install/tapo-hub-install.sh scripts/install-runtime.sh
